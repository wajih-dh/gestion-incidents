{% extends "base.html" %}
{% block contenu %}
<h2>Liste des incidents</h2>
{% if incidents %}
<table>
  <tr><th>ID</th><th>Titre</th><th>Lieu</th><th>Priorité</th><th>Statut</th><th></th></tr>
  {% for i in incidents %}
  <tr>
    <td>{{ i.id }}</td><td>{{ i.titre }}</td><td>{{ i.lieu }}</td>
    <td>{{ i.priorite }}</td><td>{{ i.statut }}</td>
    <td><a href="{{ url_for('incidents.detail', incident_id=i.id) }}">Détails</a></td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p>Aucun incident pour le moment.</p>
{% endif %}
{% endblock %}
