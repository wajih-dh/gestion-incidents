<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestion des incidents</title>
  <style>
    :root { --bleu: #2563eb; --bleu-fonce: #1e40af; --gris: #f3f4f6; --bord: #e5e7eb; --texte: #1f2937; }
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: var(--gris); color: var(--texte); margin: 0; }
    header { background: var(--bleu); color: white; padding: 18px 0; }
    header .conteneur { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    header h1 { margin: 0; font-size: 1.4rem; }
    nav a { color: white; text-decoration: none; margin-left: 18px; font-weight: 600; opacity: .9; }
    nav a:hover { opacity: 1; text-decoration: underline; }
    .conteneur { max-width: 960px; margin: 0 auto; padding: 0 16px; }
    main { padding: 24px 0 40px; }
    h2 { margin-top: 0; }
    .carte { background: white; border: 1px solid var(--bord); border-radius: 10px; padding: 22px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
    .barre { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .barre h2 { margin: 0; }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--bord); }
    th { background: var(--gris); font-size: .85rem; text-transform: uppercase; letter-spacing: .03em; }
    tr:hover td { background: #fafafa; }

    label { font-weight: 600; font-size: .9rem; }
    input, textarea, select { width: 100%; padding: 9px 10px; margin: 5px 0 14px; border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--bleu); border-color: var(--bleu); }

    .btn, button { display: inline-block; background: var(--bleu); color: white; border: 0; padding: 9px 16px; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; }
    .btn:hover, button:hover { background: var(--bleu-fonce); }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #991b1b; }
    .lien { color: var(--bleu); font-weight: 600; text-decoration: none; }
    .lien:hover { text-decoration: underline; }

    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; background: #e5e7eb; }
    .badge[data-v="Faible"] { background: #dcfce7; color: #166534; }
    .badge[data-v="Moyenne"] { background: #fef3c7; color: #92400e; }
    .badge[data-v="Élevée"] { background: #fee2e2; color: #991b1b; }
    .badge[data-v="Nouveau"] { background: #dbeafe; color: #1e40af; }
    .badge[data-v="En cours"] { background: #ffedd5; color: #9a3412; }
    .badge[data-v="Résolu"] { background: #dcfce7; color: #166534; }

    .erreur { background: #fee2e2; color: #991b1b; padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; }
    .vide { text-align: center; color: #6b7280; padding: 30px 0; }
    .infos p { margin: 8px 0; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-top: 20px; }
    .actions form { margin: 0; }
    .actions select { margin: 0 8px 0 0; width: auto; }
  </style>
</head>
<body>
  <header>
    <div class="conteneur">
      <h1>⚙️ <span style="color: gold; font-style: bold; font-size: 1.5rem;">G</span>estion des incidents informatiques</h1>
      <nav>
        <a href="{{ url_for('incidents.index') }}">Liste</a>
        <a href="{{ url_for('incidents.ajouter') }}">Ajouter un incident</a>
      </nav>
    </div>
  </header>
  <main class="conteneur">
    {% block contenu %}{% endblock %}
  </main>
  <footer class="conteneur" style="text-align:center; color:#6b7280; padding-bottom:30px;">
    Version 2 : Gestion des incidents informatiques
  </footer>
</body>
</html>
