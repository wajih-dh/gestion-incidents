{% extends "base.html" %}
{% block contenu %}
<div class="carte">
  <div class="barre">
    <h2>Incident n°{{ incident.id }} : {{ incident.titre }}</h2>
    <a class="lien" href="{{ url_for('incidents.index') }}">← Retour à la liste</a>
  </div>

  <div class="infos">
    <p><b>Description :</b> {{ incident.description }}</p>
    <p><b>Lieu :</b> {{ incident.lieu }}</p>
    <p><b>Priorité :</b> <span class="badge" data-v="{{ incident.priorite }}">{{ incident.priorite }}</span></p>
    <p><b>Statut :</b> <span class="badge" data-v="{{ incident.statut }}">{{ incident.statut }}</span></p>
  </div>

  <div class="actions">
    <form method="post" action="{{ url_for('incidents.modifier_statut', incident_id=incident.id) }}">
      <select name="statut">
        {% for s in statuts %}
        <option {% if s == incident.statut %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
      <button type="submit">Modifier le statut</button>
    </form>

    <form method="post" action="{{ url_for('incidents.supprimer', incident_id=incident.id) }}"
          onsubmit="return confirm('Supprimer cet incident ?');">
      <button type="submit" class="btn-danger">Supprimer</button>
    </form>
  </div>
</div>
{% endblock %}
