{% extends "base.html" %}
{% block contenu %}
<h2>Ajouter un incident</h2>
{% if erreur %}<p class="erreur">{{ erreur }}</p>{% endif %}
<form method="post">
  <label>Titre</label><input name="titre">
  <label>Description</label><textarea name="description" rows="4"></textarea>
  <label>Lieu (salle ou laboratoire)</label><input name="lieu">
  <label>Priorité</label>
  <select name="priorite">
    {% for p in priorites %}<option>{{ p }}</option>{% endfor %}
  </select>
  <button type="submit">Enregistrer</button>
</form>
{% endblock %}
